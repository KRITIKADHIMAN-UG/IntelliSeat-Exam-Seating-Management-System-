<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - Exam Seating System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="students">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">IntelliSeat</div>
      <div class="sidebar-sub" id="sidebarUser">Exam Seating System</div>
      <nav>
        <a href="index.html" data-page="dashboard">Dashboard / Home</a>
        <a href="students.html" data-page="students">Student Module</a>
        <a href="exams.html" data-page="exams">Exam Module</a>
        <a href="shifts.html" data-page="shifts">Shift Module</a>
        <a href="seating.html" data-page="seating">Seating Module</a>
        <a href="reports.html" data-page="reports">Reports / Downloads</a>
      </nav>
      <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
    </aside>
    <main class="main-content">
      <header class="page-header">
        <h1>Student Module</h1>
        <p>Registered students: <strong id="studentCount">100</strong></p>
      </header>
      <section class="card">
        <h2>Add Student</h2>
        <form id="studentForm" class="form-grid" novalidate>
          <label>Name <input type="text" id="studentName" required></label>
          <label>Roll Number <input type="number" id="studentRoll" min="1000" required></label>
          <label>Department <input type="text" id="studentDepartment" placeholder="CSE, ECE..." required></label>
          <label>Subject <input type="text" id="studentSubject" required></label>
          <label>Semester <input type="number" id="studentSemester" min="1" max="8" required></label>
          <label>Shift ID <input type="number" id="studentShift" min="1" placeholder="1 or 2"></label>
          <label>Default Hall <input type="text" id="studentHall" placeholder="Hall A, Hall B, Hall C"></label>
          <button type="submit" class="btn">Add Student</button>
        </form>
      </section>
      <section class="card">
        <h2>Student Records</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Roll Number</th><th>Subject</th><th>Department</th><th>Semester</th><th>Shift</th><th>Hall</th></tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
