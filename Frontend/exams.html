<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exams - Exam Seating System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="exams">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">IntelliSeat</div>
      <div class="sidebar-sub" id="sidebarUser">Exam Seating System</div>
      <nav>
        <a href="index.html" data-page="dashboard">Dashboard / Home</a>
        <a href="students.html" data-page="students">Student Module</a>
        <a href="exams.html" data-page="exams">Exam Module</a>
        <a href="shifts.html" data-page="shifts">Shift Module</a>
        <a href="seating.html" data-page="seating">Seating Module</a>
        <a href="reports.html" data-page="reports">Reports / Downloads</a>
      </nav>
      <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
    </aside>
    <main class="main-content">
      <header class="page-header">
        <h1>Exam Module</h1>
        <p>Manage exam subjects, departments, and schedules</p>
      </header>
      <section class="card">
        <h2>Add Exam</h2>
        <form id="examForm" class="form-grid" novalidate>
          <label>Exam ID <input type="number" id="examCode" min="1" required></label>
          <label>Subject <input type="text" id="examSubject" required></label>
          <label>Department <input type="text" id="examDepartment" required></label>
          <label>Semester <input type="number" id="examSemester" min="1" max="8" required></label>
          <label>Date <input type="date" id="examDate" required></label>
          <button type="submit" class="btn">Add Exam</button>
        </form>
      </section>
      <section class="card">
        <h2>Exam List</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>Subject</th><th>Department</th><th>Semester</th><th>Date</th></tr>
            </thead>
            <tbody id="examTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
