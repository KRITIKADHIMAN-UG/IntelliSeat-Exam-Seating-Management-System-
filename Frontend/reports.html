<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Exam Seating System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="reports">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">IntelliSeat</div>
      <div class="sidebar-sub" id="sidebarUser">Exam Seating System</div>
      <nav>
        <a href="index.html" data-page="dashboard">Dashboard / Home</a>
        <a href="students.html" data-page="students">Student Module</a>
        <a href="exams.html" data-page="exams">Exam Module</a>
        <a href="shifts.html" data-page="shifts">Shift Module</a>
        <a href="seating.html" data-page="seating">Seating Module</a>
        <a href="reports.html" data-page="reports">Reports / Downloads</a>
      </nav>
      <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
    </aside>
    <main class="main-content">
      <header class="page-header">
        <h1>Reports / Downloads</h1>
        <p>Export seating arrangement with hall, roll, subject, seat, and shift details</p>
      </header>
      <section class="card">
        <div class="toolbar">
          <label>Filter by Exam
            <select id="reportExamId"></select>
          </label>
          <button type="button" class="btn" id="loadReportBtn">Load Report</button>
          <button type="button" class="btn btn-outline" id="downloadCsvBtn">Download CSV</button>
          <button type="button" class="btn btn-outline" id="downloadPdfBtn">Download PDF</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Hall</th><th>Seat</th><th>Roll</th><th>Name</th><th>Department</th><th>Subject</th><th>Shift</th></tr>
            </thead>
            <tbody id="reportTableBody"></tbody>
          </table>
        </div>
        <div id="reportPrintArea" style="display:none;"></div>
      </section>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
